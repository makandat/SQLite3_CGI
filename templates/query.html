<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>SQLite3 CGI クエリー実行</title>
 <!-- BootstrapのCSS読み込み -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
 <!-- JS365Lib.js の読み込み -->
 <script src="/js/JS365Lib3.js"></script>
 <!-- CSS -->
 <style> </style>
 <!-- JavaScript -->
 <script>
   const PREFIX = "SQLite3_";
   var currentDB = "";
  
  // ページがロードされたとき
  window.onload = (event) => {
    currentDB = getStorageValue("currentDB", PREFIX, session=false);
    setValue("currentDB", currentDB);
    setValue("db", currentDB);
    
    // POST
    clickEvent("postButton", async () => {
      let sql = getValue("sql");
      if (sql.toUpperCase().startsWith("SELECT") == false) {
        alert("SQL must be 'SELECT'.");
        return;
      }
      let sql1 = sql;
      if (getCheck("escape")) {
        // SQL のパラメータ文字をエスケープする。
        sql1 = escURL(sql, true);
        setValue("sql", sql1);
      }
      // フォームを送信する。
      const rows = await fetchFormData("/cgi-bin/SQLite3/postQuery.cgi", "form1");
      if (rows.length == 0) {
        setValue("result", "データがありません。");
      }
      else {
        setValue("result", htmlTable(rows, false, "table"), false);
      }
    });

    // クリア
    clickEvent("clearButton", () => {
      setValue("sql", "");
      setValue("result", "");
    });
  }
 </script>
</head>

<body>
  <!-- ヘッダー -->
  <header class="container">
   <h1 class="header-1 text-primary p-5 text-center">SQLite3 CGI クエリー実行</h1>
  </header>

  <!-- アプリ 本体 -->
  <div id="app" class="container">
   <!-- メニュー -->
   <ul class="nav">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" href="/cgi-bin/SQLite3/index.cgi">データベース</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/tables.cgi">テーブル</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/indexes.cgi">インデックス</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/views.cgi">ビュー</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/query.cgi">クエリー</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/command.cgi">コマンド</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="javascript:location.reload()">リロード</a>
    </li>
   </ul>
   <!-- 本体 -->
   <!-- 現在のデータベース -->
   <div class="row mt-4 mb-4">
    <h3>現在のデータベース</h3>
    <p id="currentDB"></p>
   <!-- フォーム -->
   <form id="form1" class="row mt-4" method="POST" action="/cgi-bin/SQLite3/postCommand.cgi">
    <div class="mt-4 mb-2">
       <label class="form-check-label">
         <input type="checkbox" id="escape" class="form-check-control" /> エスケープが必要 (&,=,#, % などを含む)
       </label>
     </div>
     <input type="hidden" name="db" id="db" value="">
     <div class="mt-4 mb-2">
       <label>SQL (SELECT 文)
        <textarea name="sql" id="sql" class="form-control" rows="6" cols="150"></textarea>
       </label>
     </div>
     <div class="mt-4">
       <button id="postButton" type="button" class="btn btn-primary me-2">実行する</button>
       <button id="clearButton" type="button" class="btn btn-secondary">クリア</button>
     </div>
   </form>
   
   <!-- クエリー結果 -->
   <div id="result" class="row mt-5">
   </div>

  <!-- フッター -->
  <footer class="container">
   <p>&nbsp;</p>
   <p class="text-center mt-4"><a href="#top">TOP</a></p>
   <p>&nbsp;</p>
   <p>&nbsp;</p>
  </footer>
  <!-- BootstrapのJS読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
