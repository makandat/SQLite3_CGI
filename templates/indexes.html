<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>SQLite3 CGI インデックス一覧</title>
 <!-- BootstrapのCSS読み込み -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
 <!-- JS365Lib.js の読み込み -->
 <script src="/js/JS365Lib.js"></script>
 <!-- CSS -->
 <style> </style>
 <!-- JavaScript -->
 <script>
   const PREFIX = "SQLite3_";
   var currentDB = "";

  // CREATE INDEX 文を表示する。
  function showCreateIndex(name) {
    getText(`/cgi-bin/SQLite3/getCreateIndex.cgi?db=${currentDB}&name=${name}`, (text) => {
      text = text.replaceAll("\\n", "\n").trim();
      text = text.substring(1, text.length - 1);
      setValue("createIndex", text, false);
    });
  }
   
  // ページがロードされたとき
  window.onload = (event) => {
    currentDB = getStorageValue("currentDB", PREFIX, session=false);
    setValue("currentDB", currentDB);
    getJSON("/cgi-bin/SQLite3/getIndexList.cgi?db=" + currentDB, (data) => {
       if (data.length == 0) {
          setValue("message", "インデックスがありません。");
          return;
       }
       let s = "";
       for (const name of data) {
         s += `<li><a href="javascript:showCreateIndex('${name}')">${name}</a></li>\n`;
      }
      insertHTML("indexList", s, 1);
    });
  }
 </script>
</head>

<body>
  <!-- ヘッダー -->
  <header class="container">
   <h1 class="header-1 text-primary p-5 text-center">SQLite3 CGI インデックス一覧</h1>
  </header>

  <!-- アプリ 本体 -->
  <div id="app" class="container">
   <!-- メニュー -->
   <ul class="nav">
    <li class="nav-item">
      <a class="nav-link active" aria-current="page" href="/cgi-bin/SQLite3/index.cgi">データベース</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/tables.cgi">テーブル</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/indexes.cgi">インデックス</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/views.cgi">ビュー</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/query.cgi">クエリー</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="/cgi-bin/SQLite3/command.cgi">コマンド</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="javascript:location.reload()">リロード</a>
    </li>
   </ul>

   <!-- 現在のデータベース -->
   <div class="row mt-4 mb-4">
    <h3>現在のデータベース</h3>
    <p id="currentDB"></p>
   </div>
   <!-- 内容 -->
   <div class="row p-5">
    <ul id="indexList" style="list-style-type:none;" class="col-2 border ms-2 p-2"></ul>
    <pre id="createIndex" class="col border ms-2 p-2"></pre>
   </div>
   <div id="message" class="row mt-4 fs-3" style="color:magenta">

   </div>
  </div>

  <!-- フッター -->
  <footer class="container">
   <p>&nbsp;</p>
   <p class="text-center mt-4"><a href="#top">TOP</a></p>
   <p>&nbsp;</p>
   <p>&nbsp;</p>
  </footer>
  <!-- BootstrapのJS読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
